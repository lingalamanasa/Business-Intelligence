<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - Stackly Business Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --accent-badge-bg: #e0e7ff;
      --accent-badge-text: #4338ca;
      --dark-text: #0f172a;
      --gray-text: #64748b;
      --border-color: #e2e8f0;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --card-shadow: 0 25px 60px -12px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.02);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(234, 179, 8, 0.04) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    /* Outer Wrapper Card */
    .auth-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 2rem 2.2rem;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }

    /* Top Bar */
    .auth-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #6366f1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-back-home:hover {
      background: #e0e7ff;
      color: #4f46e5;
      transform: translateX(-2px);
    }

    .portal-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 600;
    }

    .portal-tag i {
      color: #6366f1;
    }

    /* Visual Banner Image */
    .auth-banner-img-box {
      width: 100%;
      height: 150px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }

    .auth-banner-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .auth-banner-img-box:hover img {
      transform: scale(1.04);
    }

    .auth-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%);
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
    }

    .auth-banner-overlay span {
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Brand Header */
    .auth-brand-center {
      text-align: center;
      margin-bottom: 1.4rem;
    }

    .brand-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 0.8rem;
    }

    .brand-icon-svg {
      width: 26px;
      height: 26px;
      color: #6366f1;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #1e1b4b;
    }

    .brand-pill-badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .auth-headline {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--dark-text);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .auth-subheadline {
      font-size: 0.88rem;
      color: var(--gray-text);
    }

    /* Role Segmented Switcher */
    .role-switcher-container {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 1.4rem;
    }

    .role-switch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .role-switch-btn.active {
      background: #ffffff;
      color: #4f46e5;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Form Fields & Grid Rows */
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.05rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--dark-text);
      margin-bottom: 0.45rem;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--dark-text);
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1em;
      cursor: pointer;
    }

    .form-input:focus, .form-select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    /* Terms Checkbox */
    .terms-row {
      margin: 1.2rem 0;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #475569;
    }

    .terms-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .terms-label input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .terms-label a {
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
    }

    .terms-label a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit-primary {
      width: 100%;
      padding: 0.95rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .btn-submit-primary:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
    }

    /* Footer Redirect */
    .auth-footer-redirect {
      text-align: center;
      margin-top: 1.3rem;
      font-size: 0.86rem;
      color: #64748b;
    }

    .auth-footer-redirect a {
      color: #6366f1;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-footer-redirect a:hover {
      text-decoration: underline;
    }

    .auth-compliance-footer {
      margin-top: 1.4rem;
      padding-top: 1.1rem;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 0.74rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-compliance-footer i {
      color: #10b981;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Top Bar -->
    <div class="auth-top-bar">
      <a href="index.html" class="btn-back-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <span class="portal-tag">
        <i class="fa-solid fa-chart-pie"></i> Telemetry Portal
      </span>
    </div>

    <!-- Visual Banner Image (Business Intelligence Theme) -->
    <div class="auth-banner-img-box">
      <img src="images/blog-executive-kpi.webp" alt="Stackly Business Intelligence Workspace">
      <div class="auth-banner-overlay">
        <span><i class="fa-solid fa-network-wired"></i> Enterprise Cloud Analytics Infrastructure</span>
      </div>
    </div>

    <!-- Brand Header -->
    <div class="auth-brand-center">
      <div class="brand-logo-row">
        <a href="index.html" style="display: inline-flex; align-items: center; text-decoration: none;" aria-label="Stackly Home">
          <img src="images/logo-dark.webp?v=3.0" alt="STACKLY Logo" class="auth-brand-logo-img" style="height: 38px; width: auto; object-fit: contain;" />
        </a>
        <span class="brand-pill-badge">BI CLOUD</span>
      </div>
      <h1 class="auth-headline">Create Your Account</h1>
      <p class="auth-subheadline">Join 2,800+ enterprise teams operating on Stackly Cloud</p>
    </div>

    <!-- Role Switcher Segmented Control -->
    <div class="role-switcher-container">
      <button type="button" class="role-switch-btn active" id="regRoleUserBtn" onclick="setRegRole('user')">
        <i class="fa-solid fa-user"></i> User
      </button>
      <button type="button" class="role-switch-btn" id="regRoleAdminBtn" onclick="setRegRole('admin')">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </button>
    </div>

    <!-- Registration Form -->
    <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
      <!-- First Name & Last Name (Side-by-side) -->
      <div class="form-row-2">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" class="form-input" placeholder="First Name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" class="form-input" placeholder="Last Name" required>
        </div>
      </div>

      <!-- Work / Corporate Email -->
      <div class="form-group">
        <label for="regEmail">Work / Corporate Email *</label>
        <input 
          type="email" 
          id="regEmail" 
          class="form-input" 
          placeholder="name@company.com" 
          required
        >
      </div>


      <!-- Password & Confirm Password (Side-by-side) -->
      <div class="form-row-2">
        <div class="form-group">
          <label for="regPassword">Password *</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required minlength="8">
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password *</label>
          <input type="password" id="regConfirm" class="form-input" placeholder="••••••••" required minlength="8">
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="terms-row">
        <label class="terms-label">
          <input type="checkbox" id="agreeTerms" required>
          <span>
            I agree to Stackly's <a href="javascript:void(0)">Terms of Service</a>, <a href="javascript:void(0)">SOC2 Security Agreement</a>, and <a href="javascript:void(0)">Privacy Policy</a>.
          </span>
        </label>
      </div>

      <!-- Submit Action Button -->
      <button type="submit" class="btn-submit-primary" id="registerSubmitBtn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>

      <!-- Redirect to Login -->
      <p class="auth-footer-redirect">
        Already have an account? <a href="login.html">Sign In here</a>
      </p>

      <!-- Security Compliance Footer -->
      <div class="auth-compliance-footer">
        <i class="fa-solid fa-shield-check"></i> SOC2 Type II & ISO 27001 Cryptographic Multi-Factor Authentication
      </div>
    </form>
  </div>

  <script>
    let activeRegRole = 'user';

    function setRegRole(role) {
      activeRegRole = role;
      const userBtn = document.getElementById('regRoleUserBtn');
      const adminBtn = document.getElementById('regRoleAdminBtn');
      const emailInput = document.getElementById('regEmail');

      if (role === 'user') {
        userBtn.classList.add('active');
        adminBtn.classList.remove('active');
        emailInput.placeholder = 'name@company.com';
      } else {
        adminBtn.classList.add('active');
        userBtn.classList.remove('active');
        emailInput.placeholder = 'admin@company.com';
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('regPassword').value;
      const conf = document.getElementById('regConfirm').value;
      if (pwd !== conf) {
        alert('Passwords do not match. Please verify.');
        return;
      }

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();

      if (email) {
        localStorage.setItem('stackly_email', email);
        const fullName = (firstName + ' ' + lastName).trim() || email.split('@')[0];
        localStorage.setItem('stackly_name', fullName);
      }
      localStorage.setItem('stackly_role', activeRegRole);

      // Redirect to login or home
      window.location.href = 'login.html';
    }

    try {
      if (!window.location.href.includes('404.html')) {
        sessionStorage.setItem('stackly_previous_page', window.location.href);
        sessionStorage.setItem('stackly_last_page', window.location.href);
        localStorage.setItem('stackly_last_page', window.location.href);
      }
    } catch (e) {}
  </script>
</body>
</html>
